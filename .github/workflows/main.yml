name: Build VISION Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify ZIP
        run: |
          test -f VISION_Android_Project_Stage5_Fixed.zip
          unzip -t VISION_Android_Project_Stage5_Fixed.zip

      - name: Extract VISION project
        run: |
          unzip -q VISION_Android_Project_Stage5_Fixed.zip -d source
          test -f source/VISION/settings.gradle.kts
          test -f source/VISION/app/build.gradle.kts

      - name: Run unit tests
        working-directory: source/VISION
        run: gradle testDebugUnitTest

      - name: Build debug APK
        working-directory: source/VISION
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VISION-debug-apk
          path: source/VISION/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
